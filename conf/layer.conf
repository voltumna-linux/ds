# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ds"
BBFILE_PATTERN_ds = "^${LAYERDIR}/"
# Higher than meta-voltumna (20): our bbappends (systemd, grub-bootconf,
# procps, pam...) must win over the base distro ones.
BBFILE_PRIORITY_ds = "22"

LAYERSERIES_COMPAT_ds = "kirkstone"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_ds = "1"

LAYERDEPENDS_ds = "core meta-voltumna intel amd-bsp elettra"
